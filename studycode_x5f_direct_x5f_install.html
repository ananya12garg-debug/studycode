Task Two: Check if number is prime
\`\`\`js
function isPrime(n){
  if(n<=1) return false;
  for(let i=2;i<=Math.sqrt(n);i++) if(n%i===0) return false;
  return true;
}

Task Three: Implement debounce
\`\`\`javascript
function debounce(fn, delay){
  let timer;
  return function(...args){
    clearTimeout(timer);
    timer=setTimeout(()=>fn.apply(this,args), delay);
  }
}
